<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Summer Liu — Frontend Developer</title>
    <meta name="description" content="Summer Liu is a frontend developer from Taiwan who turns ideas into thoughtful, well-crafted web experiences." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf9f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1915" />
    <meta property="og:title" content="Summer Liu — Frontend Developer" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" />
    <script>
      // Apply a saved theme before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
